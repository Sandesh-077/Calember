<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calember Observatory: 26 years of satellite fire detections, harmonized across MODIS and VIIRS. Pick any place on Earth and read its fire history." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070d" />
    <title>Calember Observatory</title>
    <style>
      /* the interface at 80 % on desktop screens; the 3D canvas and the maps stay at full scale (src/uiZoom.ts) */
      :root { --unzoom: 1; }
      @media (min-width: 1100px) and (min-height: 600px) and (pointer: fine) {
        html { zoom: 0.8; }
        :root { --unzoom: 1.25; }
      }
      .world, .pmap, .map { zoom: var(--unzoom); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/observatory/main.tsx"></script>
  </body>
</html>
